# Builds and pushes the data pipeline image. Submit from the repository root:
#
#   gcloud builds submit data \
#     --config data/cloudbuild.yaml \
#     --substitutions _IMAGE=<image_registry>/lir-pipeline:<tag> \
#     --service-account <build_service_account> \
#     --gcs-source-staging-dir gs://<build_source_bucket>/source
#
# The values come from `terraform output` in lir-infra.

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]

images:
  - ${_IMAGE}

options:
  # A custom build service account needs an explicit logging mode.
  logging: CLOUD_LOGGING_ONLY
