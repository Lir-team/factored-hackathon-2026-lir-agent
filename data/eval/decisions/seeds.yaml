# Labeled set for the typed decisions D1-D3 (EVAL-01). HELD-OUT: never tune prompts, keywords or
# models on it (data/AGENTS.md rule 5); only thresholds are chosen, on the validation split.
#
# Provenance: team-generated synthetic text (written for this evaluation, not customer data,
# not taken from the dataset, whose texts are templates: insights.md §5). Labels follow the
# question definitions in app/decision-layer/src/decision_layer/questions.py:
#   intent  D1  cargo_no_reconocido | cobro_indebido | consulta_movimiento | otra_queja | fuera_de_alcance
#   human   D2  the customer explicitly asks for a person
#   theft   D3  the customer says or suggests their card or data were stolen or used by others
# Every seed is one situation; its texts are paraphrases with the same labels. The split is by
# seed, so paraphrases never leak between validation and test.
# Hard cases on purpose: negations ("no quiero hablar con nadie"), figurative theft ("me están
# robando con la comisión"), slang (MX, CO, AR, BR) and portuñol.

