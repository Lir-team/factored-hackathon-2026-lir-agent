# Reglas de calidad sobre staging/, organizadas por dimensión (DAMA-DMBOK / ISO 8000).
#
# Adecuación al propósito: cada regla declara para qué uso importa (`use`) y un
# umbral de negocio (`max_fail_rate`). El mismo problema puede ser tolerable para
# análisis de tendencias y bloqueante para lo que el agente dice a un cliente.
#   use: agent       -> datos que el agente usa para responder o actuar (estricto)
#        analytics   -> análisis de demanda / priorización (tolerante)
#        ml          -> etiquetas o features para el componente aprendido
#
# Tipos de regla:
#   fail_when: expresión SQL por fila sobre `t` (la tabla). Se mide la tasa de filas que fallan.
#   metric:    SQL escalar; falla si queda fuera de [min, max].
# Las subconsultas pueden referenciar otras tablas de staging por su nombre.
#
# Ownership (principio 3): roles, no personas. Se asignan nombres al conformar el equipo.

data_products:
  customers:                {owner: "Core Banking (negocio)", steward: "Equipo datos Clir", consumers: [agent, analytics], freshness_slo: "snapshot mensual"}
  products:                 {owner: "Core Banking (negocio)", steward: "Equipo datos Clir", consumers: [agent, analytics], freshness_slo: "snapshot mensual"}
  transactions:             {owner: "Core Banking (negocio)", steward: "Equipo datos Clir", consumers: [agent, analytics], freshness_slo: "D+1"}
  call_center_interactions: {owner: "Contact Center Ops",     steward: "Equipo datos Clir", consumers: [analytics, ml],   freshness_slo: "D+1"}
  call_transcripts:         {owner: "Contact Center Ops",     steward: "Equipo datos Clir", consumers: [analytics, ml],   freshness_slo: "D+1"}
  satisfaction_surveys:     {owner: "Contact Center Ops",     steward: "Equipo datos Clir", consumers: [analytics],       freshness_slo: "D+1"}
  complaints:               {owner: "PQR / Servicio",         steward: "Equipo datos Clir", consumers: [agent, analytics], freshness_slo: "D+1"}

rules:
  # ---------------- customers ----------------
  - {id: cus_pk_unique, table: customers, dimension: uniqueness, use: agent, max_fail_rate: 0,
     metric: "select count(*) - count(distinct customer_id) from customers", max: 0}
  - {id: cus_document_unique, table: customers, dimension: uniqueness, use: agent,
     metric: "select count(*) - count(distinct document_number) from customers", max: 0}
  - {id: cus_contactable, table: customers, dimension: completeness, use: agent, max_fail_rate: 0.05,
     fail_when: "mobile_phone is null and email is null",
     why: "El handoff/callback necesita al menos un canal de contacto."}
  - {id: cus_credit_score_range, table: customers, dimension: validity, use: analytics, max_fail_rate: 0,
     fail_when: "credit_score is not null and credit_score not between 300 and 850"}
  - {id: cus_adult_at_registration, table: customers, dimension: validity, use: agent, max_fail_rate: 0,
     fail_when: "date_diff('year', date_of_birth, registration_date::date) < 18"}
  - {id: cus_country_domain, table: customers, dimension: validity, use: agent, max_fail_rate: 0,
     fail_when: "country not in ('MX','CO','AR')"}
  - {id: cus_document_type_matches_country, table: customers, dimension: consistency, use: agent, max_fail_rate: 0.01,
     fail_when: "(document_type = 'dni' and country <> 'AR') or (document_type in ('cc','ce') and country <> 'CO') or (document_type = 'curp' and country <> 'MX')",
     why: "DNI es argentino, CC/CE colombianos, CURP mexicano. Un documento incoherente invalida la verificación de identidad."}
  - {id: cus_country_matches_branch, table: customers, dimension: consistency, use: analytics, max_fail_rate: 0.01,
     fail_when: "country <> (select b.country from branches b where b.branch_id = t.registration_branch_id)"}
  - {id: cus_accent_matches_country, table: customers, dimension: consistency, use: analytics, max_fail_rate: 0.05,
     fail_when: "detected_accent is not null and detected_accent <> case country when 'MX' then 'mexican' when 'CO' then 'colombian' when 'AR' then 'argentine' end"}

  # ---------------- products ----------------
  - {id: prd_number_unique, table: products, dimension: uniqueness, use: agent,
     metric: "select count(*) - count(distinct product_number) from products", max: 0}
  - {id: prd_customer_fk, table: products, dimension: integrity, use: agent, max_fail_rate: 0,
     fail_when: "customer_id not in (select customer_id from customers)"}
  - {id: prd_local_currency_mx, table: products, dimension: accuracy, use: agent, max_fail_rate: 0.5,
     fail_when: "currency <> 'MXN' and (select c.country from customers c where c.customer_id = t.customer_id) = 'MX'",
     why: "Ningún producto de un cliente mexicano está en MXN. Saldos en moneda inverosímil = respuesta incorrecta al cliente."}
  - {id: prd_credit_limit_only_credit, table: products, dimension: consistency, use: agent, max_fail_rate: 0.01,
     fail_when: "(credit_limit is not null) <> (product_type in ('credit_card','personal_loan','mortgage'))"}
  - {id: prd_dpd_only_credit, table: products, dimension: consistency, use: agent, max_fail_rate: 0.01,
     fail_when: "days_past_due is not null and product_type not in ('credit_card','personal_loan','mortgage')"}

  # ---------------- transactions ----------------
  - {id: trx_fk_product, table: transactions, dimension: integrity, use: agent, max_fail_rate: 0,
     fail_when: "product_id not in (select product_id from products)"}
  - {id: trx_owner_matches_product, table: transactions, dimension: consistency, use: agent, max_fail_rate: 0,
     fail_when: "customer_id <> (select p.customer_id from products p where p.product_id = t.product_id)",
     why: "Si la transacción apunta a un producto de otro cliente, el agente podría revelar datos ajenos."}
  - {id: trx_currency_matches_product, table: transactions, dimension: consistency, use: agent, max_fail_rate: 0.01,
     fail_when: "currency <> (select p.currency from products p where p.product_id = t.product_id)"}
  - {id: trx_amount_positive, table: transactions, dimension: validity, use: agent, max_fail_rate: 0,
     fail_when: "amount <= 0"}
  - {id: trx_amount_usd_complete, table: transactions, dimension: completeness, use: analytics, max_fail_rate: 0,
     fail_when: "amount_usd is null"}
  - {id: trx_country_domain, table: transactions, dimension: validity, use: analytics, max_fail_rate: 0,
     fail_when: "transaction_country not in ('MX','CO','AR','BR','ES','US')"}
  - {id: trx_late_arrival, table: transactions, dimension: timeliness, use: agent, max_fail_rate: 0.01,
     fail_when: "process_lag_days < -1 or process_lag_days > 1",
     why: "Frescura D+1: una transacción que llega más tarde no es visible para el agente al día siguiente."}
  - {id: trx_fraud_score_range, table: transactions, dimension: validity, use: analytics, max_fail_rate: 0,
     fail_when: "fraud_score is not null and fraud_score not between 0 and 100"}

  # ---------------- call_center_interactions ----------------
  - {id: int_customer_fk, table: call_center_interactions, dimension: integrity, use: analytics, max_fail_rate: 0,
     fail_when: "customer_id not in (select customer_id from customers)"}
  - {id: int_contact_reason_granular, table: call_center_interactions, dimension: accuracy, use: analytics, max_fail_rate: 0.5,
     fail_when: "contact_reason = reason_category",
     why: "contact_reason debería detallar el motivo, pero es una copia de reason_category: solo hay 6 motivos."}
  - {id: int_sentiment_label_matches_score, table: call_center_interactions, dimension: consistency, use: analytics, max_fail_rate: 0.05,
     fail_when: "(detected_sentiment in ('positive','very_positive') and sentiment_score < 0) or (detected_sentiment in ('negative','very_negative') and sentiment_score > 0)"}
  - {id: int_duration_complete, table: call_center_interactions, dimension: completeness, use: analytics, max_fail_rate: 0.05,
     fail_when: "duration_seconds is null"}
  - {id: int_wait_complete, table: call_center_interactions, dimension: completeness, use: analytics, max_fail_rate: 0.05,
     fail_when: "wait_time_seconds is null and interaction_type = 'Inbound Call'"}
  - {id: int_transcript_flag_consistent, table: call_center_interactions, dimension: consistency, use: ml, max_fail_rate: 0.01,
     fail_when: "has_transcript <> (interaction_id in (select interaction_id from call_transcripts))"}
  - {id: int_accent_matches_customer, table: call_center_interactions, dimension: consistency, use: analytics, max_fail_rate: 0.05,
     fail_when: "customer_detected_accent is not null and customer_detected_accent <> (select c.detected_accent from customers c where c.customer_id = t.customer_id)"}
  - {id: int_late_arrival, table: call_center_interactions, dimension: timeliness, use: analytics, max_fail_rate: 0.01,
     fail_when: "process_lag_days < -1 or process_lag_days > 1"}

  # ---------------- call_transcripts ----------------
  - {id: trn_interaction_fk, table: call_transcripts, dimension: integrity, use: ml, max_fail_rate: 0,
     fail_when: "interaction_id not in (select interaction_id from call_center_interactions)"}
  - {id: trn_customer_matches_interaction, table: call_transcripts, dimension: consistency, use: ml, max_fail_rate: 0,
     fail_when: "customer_id <> (select i.customer_id from call_center_interactions i where i.interaction_id = t.interaction_id)"}
  - {id: trn_no_placeholders, table: call_transcripts, dimension: accuracy, use: ml, max_fail_rate: 0.01,
     fail_when: "has_unfilled_placeholder",
     why: "Texto con {monto} {moneda} sin rellenar no es habla real."}
  - {id: trn_text_diversity, table: call_transcripts, dimension: accuracy, use: ml,
     metric: "select count(distinct customer_text)::double / count(*) from call_transcripts", min: 0.1,
     why: "Representatividad para IA: si pocas frases únicas se repiten miles de veces, el texto no representa la demanda real."}
  - {id: trn_intent_label_informative, table: call_transcripts, dimension: accuracy, use: ml, max_fail_rate: 0.5,
     fail_when: "detected_intents is null or detected_intents = 'consulta_general'",
     why: "Etiqueta candidata para el clasificador de intención. Si es constante, no sirve como label."}
  - {id: trn_topic_not_copied, table: call_transcripts, dimension: accuracy, use: ml, max_fail_rate: 0.5,
     fail_when: "main_topics = (select i.reason_category from call_center_interactions i where i.interaction_id = t.interaction_id)",
     why: "Si main_topics es una copia de la categoría de la interacción, no fue extraído del texto."}

  # ---------------- satisfaction_surveys ----------------
  - {id: srv_score_range, table: satisfaction_surveys, dimension: validity, use: analytics, max_fail_rate: 0,
     fail_when: "(survey_type = 'CSAT' and main_score not between 1 and 5) or (survey_type = 'NPS' and main_score not between 0 and 10) or (survey_type = 'CES' and main_score not between 1 and 7)"}
  - {id: srv_nps_category_derivable, table: satisfaction_surveys, dimension: consistency, use: analytics, max_fail_rate: 0,
     fail_when: "survey_type = 'NPS' and coalesce(nps_category, '?') <> case when main_score >= 9 then 'Promoter' when main_score >= 7 then 'Passive' else 'Detractor' end"}
  - {id: srv_after_interaction, table: satisfaction_surveys, dimension: timeliness, use: analytics, max_fail_rate: 0,
     fail_when: "survey_date < (select i.interaction_date from call_center_interactions i where i.interaction_id = t.interaction_id)"}
  - {id: srv_customer_matches_interaction, table: satisfaction_surveys, dimension: consistency, use: analytics, max_fail_rate: 0,
     fail_when: "customer_id <> (select i.customer_id from call_center_interactions i where i.interaction_id = t.interaction_id)"}

  # ---------------- complaints ----------------
  - {id: cmp_origin_interaction_linked, table: complaints, dimension: completeness, use: analytics, max_fail_rate: 0.5,
     fail_when: "origin_interaction_id is null and reception_channel = 'Call Center'",
     why: "Sin este vínculo no se puede trazar llamada -> queja (linaje del caso)."}
  - {id: cmp_product_belongs_to_customer, table: complaints, dimension: consistency, use: agent, max_fail_rate: 0,
     fail_when: "affected_product_id is not null and customer_id <> (select p.customer_id from products p where p.product_id = t.affected_product_id)"}
  - {id: cmp_amount_currency_pair, table: complaints, dimension: consistency, use: agent, max_fail_rate: 0,
     fail_when: "(claimed_amount is null) <> (currency is null)"}
  - {id: cmp_resolution_after_creation, table: complaints, dimension: validity, use: analytics, max_fail_rate: 0,
     fail_when: "resolution_date < creation_date"}
  - {id: cmp_resolved_has_date, table: complaints, dimension: completeness, use: analytics, max_fail_rate: 0.01,
     fail_when: "status in ('Resolved','Closed') and resolution_date is null"}
  - {id: cmp_resolution_days_consistent, table: complaints, dimension: consistency, use: analytics, max_fail_rate: 0.01,
     fail_when: "resolution_days is not null and resolution_date is not null and abs(resolution_days - date_diff('day', creation_date, resolution_date)) > 1"}
  - {id: cmp_description_informative, table: complaints, dimension: accuracy, use: ml,
     metric: "select count(distinct description)::double / count(*) from complaints", min: 0.1,
     why: "Descripción libre como fuente de intención/NLP."}
  - {id: cmp_late_arrival, table: complaints, dimension: timeliness, use: agent, max_fail_rate: 0.01,
     fail_when: "process_lag_days < -1 or process_lag_days > 1"}
