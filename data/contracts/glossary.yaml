# Shared semantics (principle 10): single source of truth for:
#   1) mappings from raw values -> canonical codes (used by pipelines/staging.py)
#   2) business definitions of metrics (used by analysis, eval and the agent)
#
# Why it exists: the v1.0.0 dictionary documents values in English, but the
# data arrives in Spanish and with variants ("México" vs "Mexico"). Many
# "quality" problems are really definition problems.
# Canonical codes: English snake_case, independent of the customer's language
# (the agent serves customers in ES and PT).

value_maps:
  country:
    applies_to: [customers.country, branches.country, service_agents.country_of_origin, transactions.transaction_country]
    values: {"México": MX, "Mexico": MX, "Colombia": CO, "Argentina": AR, "Brazil": BR, "Spain": ES, "USA": US}

  product_type:
    applies_to: [products.product_type]
    values:
      "Cuenta Ahorro": savings_account
      "Cuenta Corriente": checking_account
      "Tarjeta Crédito": credit_card
      "Tarjeta Débito": debit_card
      "Préstamo Personal": personal_loan
      "Préstamo Hipotecario": mortgage
      "Inversión": investment
      "Seguro": insurance

  reason_category:
    # "Retención" is not in the dictionary: undocumented value (semantic schema drift).
    applies_to: [call_center_interactions.reason_category, call_center_interactions.contact_reason, call_transcripts.main_topics]
    values: {"Transaccional": transactional, "Producto": product, "Queja": complaint, "Técnico": technical, "Comercial": commercial, "Retención": retention}

  sentiment:
    # "Muy Positivo" is not documented.
    applies_to: [call_center_interactions.detected_sentiment]
    values: {"Muy Positivo": very_positive, "Positivo": positive, "Neutral": neutral, "Negativo": negative, "Muy Negativo": very_negative}

  comment_sentiment:
    applies_to: [satisfaction_surveys.comment_sentiment]
    values: {"Positive": positive, "Neutral": neutral, "Negative": negative}

  document_type:
    # The dictionary lists CURP; none appear. "Pasaporte" comes in Spanish.
    applies_to: [customers.document_type]
    values: {"DNI": dni, "CC": cc, "CE": ce, "Pasaporte": passport, "Passport": passport, "CURP": curp}

  complaint_category:
    applies_to: [complaints.category]
    values: {"Transactions": transactions, "Fees": fees, "Technical": technical, "Branch": branch, "Service": service}

  complaint_subcategory:
    applies_to: [complaints.subcategory]
    values:
      "Cargo no reconocido": unrecognized_charge
      "Cobro indebido": improper_fee
      "Problema con app": app_issue
      "Atención en sucursal": branch_service
      "Calidad de servicio": service_quality

  agent_specialty:
    applies_to: [service_agents.specialty]
    values:
      "Fraudes": fraud
      "Cobranza": collections
      "Retención": retention
      "Soporte Técnico": tech_support
      "Créditos": credit
      "Inversiones": investments
      "Ventas": sales
      "Quejas y Reclamos": complaints

business_terms:
  contact:
    definition: "One row of call_center_interactions (call, chat, email or video) from a customer."
  fcr:
    definition: "First Contact Resolution. Share of contacts with was_resolved = true."
    caveat: "It is self-reported by the source system. It is checked against repeat_contact_7d, which is observable."
  repeat_contact_7d:
    definition: "A contact is 'repeated' if the same customer_id contacts again within 7 days with the same reason_category."
    rationale: "Observable proxy for non-resolution, independent of the was_resolved label."
  escalation:
    definition: "was_escalated = true: the contact was escalated to a supervisor."
  complaint_sla_breach:
    definition: "sla_breached = true in complaints."
  active_customer:
    definition: "customers.customer_status = 'Active'."
  amount_usd:
    definition: "Amount in USD. If the currency is USD, it is the amount. If missing, it is imputed with daily_exchange_rates for the transaction_date day (flag amount_usd_imputed)."
  process_lag_days:
    definition: "date(event) - process_date. Measures the timeliness of the load."
