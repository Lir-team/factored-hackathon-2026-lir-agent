[project]
name = "lir-evals"
version = "0.1.0"
description = "Scenario evals for the Lir agent: JTBD tasks, isolated trials, code graders, promptfoo runner"
requires-python = ">=3.13"
dependencies = [
    "decision-layer",
    "lir-agent",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.uv.sources]
lir-agent = { path = "../lir-agent", editable = true }
decision-layer = { path = "../decision-layer", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
