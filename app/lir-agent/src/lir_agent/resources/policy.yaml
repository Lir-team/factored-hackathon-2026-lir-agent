# SYNTHETIC team policy for the "unrecognized charge" flow. It is NOT a real bank policy.
# Thresholds are team assumptions to be reviewed and reported as such
# (Bases: "Use approved rules or a clearly labeled synthetic policy service").
#
# Rules are evaluated top to bottom; the first rule whose `when` matches wins.
# `when` maps a fact name to {operator: value}; all conditions must hold. An empty `when` always matches.
# Operators: eq, ne, gt, gte, lt, lte, in.
version: 0.5.0-synthetic

# Maps policy fact names to the question keys used by agent/decisions/questions.py.
decision_keys:
  intent: intencion
  wants_human: pide_humano
  theft_suspected: sospecha_robo
  confirms: confirma
  merchant: comercio

# Turn-level routing, from the typed decisions on the customer's message (before any lookup).
# Asymmetric thresholds: failing to route someone who needs a human is worse than routing too often.
turn_rules:
  - id: T0_decisions_unavailable
    lane: escalate
    reason: No decision model could classify the message (safe fallback)
    when: {decisions_available: {eq: false}}
  # Structured answers from the web form outrank what a model infers from the description.
  - id: T0b_card_freeze_requested
    lane: escalate
    reason: >-
      The customer asked to freeze their card. This assistant cannot freeze cards: tell them
      clearly that the card is NOT frozen yet and that a specialist will do it first
    when: {case_freeze_requested: {eq: true}}
  - id: T0c_fraud_reported
    lane: escalate
    reason: The customer reported fraud or a lost or stolen card in the form
    when: {case_fraud_reported: {eq: true}}
  - id: T1_wants_human
    lane: escalate
    reason: Customer explicitly asks for a person
    when: {wants_human_p: {gte: 0.50}}
  - id: T2_confirmation_received
    lane: proceed
    reason: Customer confirmed the pending dispute
    when: {confirmed_now: {eq: true}}
  - id: T3_theft_suspected
    lane: escalate
    reason: Possible card theft or cloning, handled by the fraud team
    when: {theft_suspected_p: {gte: 0.30}}
  - id: T3b_awaiting_confirmation
    lane: confirm
    reason: A dispute is pending the customer's explicit confirmation
    when: {awaiting_confirmation: {eq: true}}
  - id: T4_uncertain_intent
    lane: clarify
    reason: The customer's need is unclear
    when: {intent_p: {lt: 0.50}}
  - id: T5_out_of_scope
    lane: out_of_scope
    reason: Request not supported by this agent
    when: {intent: {eq: fuera_de_alcance}}
  - id: T6_other_complaint
    lane: escalate
    reason: Complaint outside the charge flow, intake by a human
    when: {intent: {eq: otra_queja}}
  - id: T9_in_scope
    lane: proceed
    reason: Charge or transaction inquiry, investigate
    when: {}

# Case-level decision, from the evidence of one concrete transaction.
case_rules:
  - id: C1_high_fraud_score
    lane: escalate
    reason: Needs review by a specialist
    when: {fraud_score: {gte: 70}}
  - id: C2_foreign_relevant_amount
    lane: escalate
    reason: Relevant amount outside the customer's country
    when: {foreign: {eq: true}, amount_usd: {gte: 300}}
  # Fail closed: an unknown country must not pass as a domestic charge.
  - id: C2b_country_unverified
    lane: escalate
    reason: Relevant amount whose country could not be verified
    when: {country_resolved: {eq: false}, amount_usd: {gte: 300}}
  - id: C3_pending
    lane: explain
    reason: Pending authorization, not a final charge yet
    when: {status: {eq: Pending}}
  - id: C4_reversed
    lane: explain
    reason: The charge was already reversed
    when: {status: {eq: Reversed}}
  - id: C5_declined
    lane: explain
    reason: The transaction was declined, nothing was charged
    when: {status: {eq: Declined}}
  - id: C6_duplicate_high_amount
    lane: escalate
    reason: Possible duplicate with a high amount
    when: {has_duplicate: {eq: true}, amount_usd: {gte: 1000}}
  - id: C7_duplicate
    lane: dispute
    reason: Same merchant and amount within the duplicate window
    when: {has_duplicate: {eq: true}}
  - id: C8_high_amount
    lane: escalate
    reason: Amount above the automation limit
    when: {amount_usd: {gte: 1000}}
  - id: C9_habitual_merchant
    lane: explain
    reason: The customer has paid this merchant before
    when: {merchant_prior_count: {gte: 2}}
  - id: C10_no_conclusive_rule
    lane: propose
    reason: No conclusive rule, a human approves the drafted answer
    when: {}

# Which tools each turn lane may call. Enforced in before_tool_callback, not in the prompt.
tools_by_turn_lane:
  proceed: [get_my_customer_profile, find_candidate_transactions, get_transaction_evidence, open_dispute,
            request_human_handoff]
  clarify: [get_my_customer_profile, find_candidate_transactions, request_human_handoff]
  confirm: [get_my_customer_profile, get_transaction_evidence, request_human_handoff]
  # Escalated turns may still look up the charge the customer described (read-only), so it
  # reaches the specialist in the handoff packet. Disputes stay out of this lane.
  escalate: [find_candidate_transactions, get_transaction_evidence, request_human_handoff]
  out_of_scope: [get_my_customer_profile, request_human_handoff]

# What the specialist still has to resolve, per rule that sends the case to a human
# (Bases §3: "unresolved questions"). Added to the handoff packet in code; the model may add
# more. Keys must be rule ids above.
handoff_open_questions:
  T0_decisions_unavailable:
    - "Clasificar el pedido: el modelo de decisiones no respondió."
  T0b_card_freeze_requested:
    - "PRIORIDAD: bloquear la tarjeta. El cliente lo pidió en el formulario y este canal no bloquea tarjetas."
    - "¿Hay otros movimientos que el cliente no reconoce?"
  T0c_fraud_reported:
    - "El cliente reportó fraude o pérdida/robo en el formulario: ¿hay que bloquear la tarjeta?"
    - "¿Hay otros movimientos que el cliente no reconoce?"
  T1_wants_human:
    - "Qué necesita el cliente: pidió una persona antes de detallar el caso."
  T3_theft_suspected:
    - "¿La tarjeta sigue en poder del cliente? Bloquearla si corresponde."
    - "¿Hay otros movimientos que el cliente no reconoce?"
  T6_other_complaint:
    - "Detalle de la queja: dónde, cuándo y qué ocurrió."
  C1_high_fraud_score:
    - "Validar con el cliente si reconoce esta transacción de alto riesgo."
  C2_foreign_relevant_amount:
    - "¿El cliente estuvo en el país de la transacción o la autorizó?"
  C2b_country_unverified:
    - "Verificar dónde ocurrió la transacción: el país no se pudo resolver."
  C6_duplicate_high_amount:
    - "Confirmar el duplicado y decidir la disputa: el monto supera el límite de automatización."
  C8_high_amount:
    - "Revisar el cargo: el monto supera el límite de automatización."
  C10_no_conclusive_rule:
    - "Ninguna regla es concluyente: revisar con el cliente el comercio y el origen del cargo."

evidence:
  duplicate_window_hours: 24

search:
  amount_tolerance_pct: 2.0
  # Product decision: before showing any charge, the customer must give one concrete detail
  # (amount, merchant, or a date range of at most this many days). "La semana pasada" alone
  # gets a question back, whatever the decision model thinks the intent is.
  max_date_only_range_days: 1
  max_candidates: 5
  merchant_min_probability: 0.50

confirmation:
  min_probability: 0.80

# Data minimization for external model requests (Bases, data boundaries; data/AGENTS.md rule 3).
# Tool results sent to the LLM include only these fields. Internal ids, risk scores and country
# signals stay in code: the LLM sees session-scoped references (T1, T2, ...) and the policy lane.
llm_exposure:
  # Identity documents, contact data, address, demographics, financials and the customer id are absent.
  customer_fields: [segment, customer_status, registration_date, country, accepts_marketing]
  candidate_fields: [transaction_date, amount, currency, merchant_name, merchant_category, transaction_status,
                    transaction_type, channel]
  evidence_fields: [date, amount, currency, merchant_name, merchant_category, status,
                    transaction_type, channel, merchant_prior_count, merchant_last_seen, has_duplicate]
  # Rule ids stay in state and audit; they can reveal risk signals (e.g. a high fraud score).
  outcome_fields: [lane, reason]
  # Bank records that identify the customer or their transactions leave only as
  # placeholders ([[COMERCIO_1]], [[MONTO_2]], ...). The placeholder table stays in the session
  # (our infrastructure) and replies are resolved in code before the customer reads them, so
  # the LLM provider never receives the customer's name, merchants, amounts or dates.
  pseudonymized_fields:
    first_name: NOMBRE
    registration_date: FECHA
    merchant_name: COMERCIO
    amount: MONTO
    transaction_date: FECHA
    date: FECHA
    merchant_last_seen: FECHA

# Deterministic output guard: a reply matching a pattern is replaced by `fallback_message`
# in the customer's language (detected in code from their message).
output_guard:
  # Always blocked, even inside a negation: asking for credentials.
  forbidden_patterns:
    - '(?i)\b(cvv|cvc|clave|contraseña|senha|pin)\b.*\?'
  # Refund promises. Blocked unless a negation precedes them in the same clause, so
  # "no puedo prometer que te vamos a devolver" passes and "te vamos a devolver" does not.
  forbidden_unless_negated:
    - '(?i)\b(te|le)\s+(vamos\s+a\s+)?(devolver|reembolsar|reintegrar)'
    - '(?i)\breembols\w*\s+(aprobad|confirmad|garantizad)'
    - '(?i)\b(vamos|iremos)\s+(devolver|reembolsar|estornar)'
    - '(?i)\bestorno\s+(aprovad|confirmad|garantid)'
    # Card freezes: no tool freezes a card, so a reply saying one is frozen is never true.
    - '(?i)\b(tarjeta|cart[aã]o)\s+(ya\s+|j[aá]\s+)?(est[aá]|qued[oó]|fue|foi|ficou)\s+(bloquead|congelad)'
    - '(?i)\b(bloqueamos|congelamos|bloqueei|congelei)\b'
  # A negation only cancels a promise when every word between them is listed here, so
  # "no puedo prometer que te vamos a devolver" passes but "si no lo reconoces te vamos
  # a devolver" and "no te preocupes que te vamos a devolver" are blocked. A missing word
  # can only block a safe reply (the fallback is sent), never let a promise through.
  negation_bridge_words: [
    # Modal verbs: "no puedo / não posso / no conseguimos"
    puedo, podemos, puede, pueden, poder, posso, pode, podem, consigo, conseguimos,
    # Commitment verbs: "prometer, confirmar, garantizar, asegurar"
    prometer, prometo, prometemos, confirmar, confirmo, confirmamos,
    garantizar, garantizo, garantizamos, garantir, garanto, garantimos,
    asegurar, aseguro, aseguramos, assegurar, asseguro, asseguramos,
    # Function words and pronouns: "no puedo confirmar todavía que te ..."
    que, se, te, le, lhe, lo, la, a, o, aún, aun, todavía, ainda,
    por, este, esse, canal, ahora, agora,
  ]
  fallback_message:
    es: >-
      Tu caso quedó registrado y un especialista lo revisará. Por este canal no podemos
      confirmar devoluciones ni bloqueos de tarjeta.
    pt: >-
      Seu caso foi registrado e um especialista vai analisá-lo. Por este canal não podemos
      confirmar estornos nem bloqueios de cartão.
