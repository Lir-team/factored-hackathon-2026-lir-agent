# The HTML case file a bank specialist reads (GET /v1/handoffs/{id}/report).
# Thresholds are read from policy.yaml (the rule and fact named here), never repeated.

priority:
  default: medium
  rules:
    T0_decisions_unavailable: medium
    T0b_card_freeze_requested: high
    T0c_fraud_reported: high
    T1_wants_human: medium
    T3_theft_suspected: high
    T6_other_complaint: low
    C1_high_fraud_score: high
    C2_foreign_relevant_amount: high
    C2b_country_unverified: medium
    C6_duplicate_high_amount: high
    C8_high_amount: high
    C10_no_conclusive_rule: medium

# Risk gauges: the highest value among the verified transactions against the policy limit.
gauges:
  - {label: fraud_score, field: fraud_score, rule: C1_high_fraud_score, fact: fraud_score, max: 100}
  - {label: amount_usd, field: amount_usd, rule: C8_high_amount, fact: amount_usd}

# Typed decisions of the last turn, each against the threshold the policy acts on.
decisions:
  - {key: intencion, label: intent, rule: T4_uncertain_intent, fact: intent_p}
  - {key: pide_humano, label: wants_human, rule: T1_wants_human, fact: wants_human_p}
  - {key: sospecha_robo, label: theft, rule: T3_theft_suspected, fact: theft_suspected_p}

